# /etc/systemd/zram-generator.conf
# Galaxy Book 4 Pro (GB4P) zram swap configuration
#
# zram0 device sized to 100% of RAM (16GB / 16384MB on 16GB RAM model)
# zstd compression algorithm (high compression ratio and low CPU overhead)
# swap-priority = 100 (higher priority than disk swap /swap.img with priority -1)

[zram0]
zram-size = 16384
compression-algorithm = zstd
swap-priority = 100

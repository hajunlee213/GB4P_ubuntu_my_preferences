# /etc/sysctl.d/99-zram.conf
# Galaxy Book 4 Pro (GB4P) zram 커널 파라미터 최적화
#
# 1. vm.swappiness = 150: 초고속 RAM 압축을 적극 활용하여 파일 캐시를 최대한 보존 (기본값 60)
# 2. vm.page-cluster = 0: zram 랜덤 액세스 특성에 맞춰 단일 페이지(4KB) 단위 I/O로 읽기 증폭 제거 (기본값 3)
# 3. vm.watermark_boost_factor = 0: 메모리 급증 시 kswapd 조기 과잉 회수 방지 및 지연 스파이크 차단 (기본값 15000)
# 4. vm.watermark_scale_factor = 125: kswapd 기동 임계점을 완만하게 확보하여 부드러운 메모리 회수 유도 (기본값 10)
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
